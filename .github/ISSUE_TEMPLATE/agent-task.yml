name: Agent task contract
description: Define a scoped task for an agent.
labels:
  - agent-task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should the agent deliver?
    validations:
      required: true
  - type: textarea
    id: context-links
    attributes:
      label: Context links
      description: Add relevant issues, pull requests, or documentation.
  - type: input
    id: in-scope-paths
    attributes:
      label: In-scope paths
      description: List the files or directories the agent may change.
    validations:
      required: true
  - type: input
    id: out-of-scope
    attributes:
      label: Out of scope
      value: alembic/, .github/, pyproject.toml, any new dependency
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that define completion.
    validations:
      required: true
  - type: textarea
    id: stop-and-ask-a-human
    attributes:
      label: Stop and ask a human if
      description: Describe situations where work should pause for human guidance.
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: Name or GitHub handle of the intended reviewer.
